[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-k0-kernel"
version = "0.1.0"
description = "Default-off typed contracts and recomputing replay foundation for EGO K0"
requires-python = ">=3.11"

[project.scripts]
ego-k0-kernel = "ego_k0_kernel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
