[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-outcome-utility"
version = "0.1.0"
description = "Default-off deterministic outcome utility functional slice for bounded EGO engineering evidence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ego-outcome-utility = "ego_outcome_utility.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
