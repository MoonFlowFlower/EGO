<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EgoDesktop Pet Mode</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <main id="pet-shell" class="pet-shell">
      <section class="pet-panel">
        <h1>Pet mode</h1>
        <p id="pet-status">default-off developer carrier loading…</p>
        <div id="pet-needs" class="pet-needs" aria-live="polite"></div>
        <div id="pet-bubble" class="pet-bubble" aria-live="polite"></div>
        <div class="pet-controls" aria-label="pet input relay controls">
          <button id="pet-feed" type="button">feed</button>
          <button id="pet-touch" type="button">pet</button>
          <button id="pet-ablation" type="button" data-enabled="false">toggle update freeze</button>
        </div>
        <pre id="pet-trace" class="pet-trace"></pre>
      </section>
    </main>
    <script src="./petRenderer.js"></script>
  </body>
</html>
