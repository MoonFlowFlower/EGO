adam:
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
arms:
- gru_fixed
- gru_mb_plastic
bootstrap_replicates: 10000
es_rank_ties: average rank
execution: one-step CUDA Graph; all-dead check each 32 steps
final_selection: generation_400_mean
gru_convention: PyTorch reset-after; z retains old hidden
holdout_episodes: 1024
kc_ties: stable descending, lower index first
