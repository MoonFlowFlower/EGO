version: 2

project:
  name: Ego
  product_lane: v2_product
  explicit_entrypoint: scripts/run_ego_life_playground_v0.py
  default_enabled: false
  autostart: false
  background_dispatch: false
  network: false
  llm: false

authority:
  product_route_writer: intelligence-theory-lab/artifacts/ROUTE-STATE-MACHINE-001A/product_axis_state.json
  local_role: pinned_read_only_mirror
  source_pin: artifacts/ROUTE-STATE-MACHINE-001A/product_axis_source_pin.json
  active_context: docs/ACTIVE_CONTEXT_PACK.md

session_bootstrap:
  command: [python, scripts/codex_session_guard.py, bootstrap, --format, markdown]
  required_checks: [git_identity, pinned_product_axis_mirror, stale_context]

default_verify:
  commands:
    - python scripts/codex/render_active_views.py --check
    - python scripts/codex/verify_route_convergence.py
    - python scripts/run_ego_life_playground_v0.py --quick-check
    - python -m pytest -q tests/test_ego_life_playground_v0.py tests/test_ego_life_playground_v2_microworld.py tests/test_v2_only_entrypoints.py scripts/tests/test_product_axis.py scripts/tests/test_stale_context.py scripts/tests/test_retired_runtime_inventory.py scripts/tests/test_codex_session_guard.py
    - git diff --check

closeout:
  command: [python, scripts/codex_session_guard.py, closeout-check, --format, markdown]
  scoped_staging_required: true
  git_add_all_forbidden: true
  push_required: false

boundary_change:
  fields: [product_mainline, interactive_entrypoint, enabled, default_enabled, autostart, background_dispatch, network, llm, science_weight, runtime_authority, retired_projects, claim_ceiling]
  itl_red_transition_required: true
  ordinary_v2_source_task_requires_itl_sync: false

claim_ceiling: local explicit V2 product mainline and bounded engineering/replay evidence only
auto_remote_anchor: forbidden
